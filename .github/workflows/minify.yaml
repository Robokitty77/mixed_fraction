name: Run C++ Minifier Python Script

on:
  release:
    types: [published]
permissions:
  contents: write 


jobs:
  run-minifier:
    runs-on: ubuntu-latest
    steps:
        #4.2.2 or else it throws random warnings
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' 

      - name: Download minifier script
        run: |
          curl -sSL https://raw.githubusercontent.com/Scylardor/cminify/refs/heads/master/minifier.py -o minifier.py
          
      - name: Run python script
        run: python minifier.py fraction.h > fraction.min.h

      - name: Save minified file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: minified-header-file
          path: fraction.min.h
          
      - name: Upload assets to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            fraction.h
            fraction.min.h
